<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Hub de Streaming</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Central de Mídia</h1>
        <p>Seus canais e filmes gratuitos a um clique.</p>
    </header>

    <main class="grid-container">
        <a href="https://pluto.tv/" target="_blank" class="card">
            <h2>Pluto TV</h2>
            <p>TV ao vivo, Filmes e Séries</p>
        </a>

        <a href="https://globoplay.globo.com/" target="_blank" class="card">
            <h2>Globoplay</h2>
            <p>TV Globo Ao Vivo e Futura</p>
        </a>

        <a href="https://www.youtube.com/c/CazeTV" target="_blank" class="card">
            <h2>CazéTV</h2>
            <p>Futebol e Esportes Ao Vivo</p>
        </a>

        <a href="https://play.mercadolivre.com.br/" target="_blank" class="card">
            <h2>Mercado Play</h2>
            <p>Filmes e Séries On Demand</p>
        </a>

        <a href="https://www.vix.com/" target="_blank" class="card">
            <h2>Vix</h2>
            <p>Filmes de Ação e Novelas</p>
        </a>

        <a href="https://www.plex.tv/pt-br/watch-free-tv/" target="_blank" class="card">
            <h2>Plex</h2>
            <p>TV Gratuita e Documentários</p>
        </a>
    </main>
</body>
</html>
